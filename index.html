<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRUAIR.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio GRUAIR.COM.BR está disponível para venda. Entre em contato para fazer uma proposta.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f9fc 0%, #dceef7 100%);
      color: #102a43;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: rgba(0, 119, 182, 0.08);
      top: -280px;
      right: -160px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .icon {
      font-size: 32px;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(16, 42, 67, 0.2);
      border-radius: 50px;
      padding: 9px 18px;
      margin-bottom: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0077b6;
    }

    h1 {
      font-size: clamp(44px, 9vw, 92px);
      letter-spacing: -3px;
      margin-bottom: 18px;
      color: #102a43;
    }

    .air {
      color: #0096c7;
    }

    h2 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      max-width: 650px;
      margin: 0 auto 38px;
      color: #486581;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #0077b6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: 0.25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #0096c7;
    }

    .footer {
      margin-top: 55px;
      color: #829ab1;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">✈</div>

    <div class="tag">Domínio disponível</div>

    <h1>GRU<span class="air">AIR</span></h1>

    <h2>Este domínio está à venda.</h2>

    <p>
      Um domínio curto, direto e memorável, com forte conexão com
      Guarulhos, aeroporto, aviação, turismo, viagens e mobilidade.
      Um endereço estratégico para uma nova marca digital.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20GRUAIR.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      GRUAIR.COM.BR
    </div>

  </main>

</body>
</html>
